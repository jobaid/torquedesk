# ---------------------------------------------------------------------------
# Fixora production nginx — two public hostnames.
#
#   www.fixoraerp.com  -> static marketing site at /var/www/fixora-marketing
#   my.fixoraerp.com   -> shop manager UI (SPA from Go server on :8080)
#                         + SaaS admin at /lightspeed/admin (same SPA, same
#                           container; the random-sounding path keeps it
#                           unguessable, nginx rate-limits the login).
#
# Both subdomains share one TLS cert issued for all three names via certbot.
# ---------------------------------------------------------------------------

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;

# -------- MARKETING: www.fixoraerp.com -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.fixoraerp.com fixoraerp.com;

    ssl_certificate     /etc/letsencrypt/live/fixoraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixoraerp.com/privkey.pem;

    root /var/www/fixora-marketing;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / { try_files $uri $uri/ /index.html; }
}

# -------- SHOP MANAGER + ADMIN: my.fixoraerp.com ---------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name my.fixoraerp.com;

    ssl_certificate     /etc/letsencrypt/live/fixoraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixoraerp.com/privkey.pem;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hide the admin URL from search engines & scanners
    add_header X-Robots-Tag "noindex, nofollow" always;
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /lightspeed/\n";
    }

    # Rate limit shop + owner login endpoints
    location = /api/auth/company-login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
    location = /api/auth/login {
        limit_req zone=admin_limit burst=3 nodelay;
        # To add a Basic Auth layer in front of the admin login, uncomment:
        # auth_basic           "Fixora Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Optional extra Basic Auth on just the admin area (defence in depth):
    # location /lightspeed/admin {
    #     auth_basic           "Fixora Admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd-admin;
    #     proxy_pass http://127.0.0.1:8080;
    #     include /etc/nginx/proxy_params;
    # }
    # location /api/owner/ {
    #     auth_basic           "Fixora Admin";
    #     auth_basic_user_file /etc/nginx/.htpasswd-admin;
    #     proxy_pass http://127.0.0.1:8080;
    #     include /etc/nginx/proxy_params;
    # }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}

# -------- HTTP -> HTTPS redirect -------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fixoraerp.com www.fixoraerp.com my.fixoraerp.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
