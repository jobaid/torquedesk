# ---------------------------------------------------------------------------
# Fixora production nginx config
#
# Three subdomains map to the same backend container:
#   www.fixoraerp.com  -> static marketing site (served from /var/www/fixora-marketing)
#   shop.fixoraerp.com -> shop manager UI (SPA served from the Go server)
#   my.fixoraerp.com   -> SaaS admin UI at /main/admin (only this subdomain
#                         serves the admin; everything else returns 404)
#
# Both shop & admin hit the same backend on 127.0.0.1:8080 — the Go server
# serves /api/* for API and the built SPA (dist/) for everything else.
# ---------------------------------------------------------------------------

# -------- Rate limit zones (shared across server blocks) --------
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/m;

# -------- MARKETING (www.fixoraerp.com) ------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fixoraerp.com fixoraerp.com;

    ssl_certificate     /etc/letsencrypt/live/fixoraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fixoraerp.com/privkey.pem;

    root /var/www/fixora-marketing;
    index index.html;

    # Standard security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / { try_files $uri $uri/ /index.html; }
}

# -------- SHOP MANAGER (shop.fixoraerp.com) --------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.fixoraerp.com;

    ssl_certificate     /etc/letsencrypt/live/shop.fixoraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.fixoraerp.com/privkey.pem;

    client_max_body_size 100M;  # bundle imports can be large

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block admin path on the shop subdomain — admin lives only on my.*
    location ~* ^/(main/admin|owner) {
        return 404;
    }

    # Rate-limit the login endpoint
    location = /api/auth/company-login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }
}

# -------- SAAS ADMIN (my.fixoraerp.com/main/admin) -------------------------
# Only /main/admin and /api/owner are served here. Everything else returns 404
# so hackers scanning the subdomain for a login page see nothing useful.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name my.fixoraerp.com;

    ssl_certificate     /etc/letsencrypt/live/my.fixoraerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my.fixoraerp.com/privkey.pem;

    client_max_body_size 100M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Keep the admin UI out of search indices.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # Robots: block all crawlers.
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Optional: HTTP Basic Auth wrapper on top of app login (defence in depth).
    # Generate /etc/nginx/.htpasswd-admin via `htpasswd -c /etc/nginx/.htpasswd-admin <user>`
    # Uncomment the two auth_basic lines in each location below when ready.

    # Rate-limit owner login
    location = /api/auth/login {
        limit_req zone=admin_limit burst=3 nodelay;
        # auth_basic           "Fixora Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Owner API
    location /api/owner/ {
        # auth_basic           "Fixora Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Admin SPA at /main/admin
    location /main/admin {
        # auth_basic           "Fixora Admin";
        # auth_basic_user_file /etc/nginx/.htpasswd-admin;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Everything else on this subdomain returns 404 (hide the shop UI).
    location / {
        return 404;
    }
}

# -------- HTTP -> HTTPS redirect for all three ---------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fixoraerp.com www.fixoraerp.com shop.fixoraerp.com my.fixoraerp.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
